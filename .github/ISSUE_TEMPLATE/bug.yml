name: 버그 신고
description: 킷을 쓰다 만난 문제
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 발행본(mirror)이라 PR 은 반영하지 않고 Issues 로 받습니다.
        보안 문제는 이 양식 대신 `CONTRIBUTING.md` 의 보안 안내를 따라 비공개로 알려 주세요.
  - type: input
    id: kit_version
    attributes:
      label: 킷 판 (KIT_VERSION 값)
      description: 저장소 루트 `KIT_VERSION` 파일의 값을 적습니다.
      placeholder: 1.0.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: flavor
      description: 문제가 난 flavor 를 고릅니다.
      options:
        - dev
        - stg
        - prod
    validations:
      required: true
  - type: checkboxes
    id: providers
    attributes:
      label: 켠 로그인 수단
      description: config 의 `enabledAuthProviders` 에 넣은 것을 모두 고릅니다.
      options:
        - label: google
        - label: apple
        - label: facebook
        - label: kakao
        - label: naver
        - label: line
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      options:
        - Android
        - iOS
  - type: textarea
    id: what
    attributes:
      label: 무엇이 일어났나
      description: 화면에 보인 것 · 오류 문구를 적습니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 앱을 연 뒤 문제가 날 때까지 한 일을 순서대로 적습니다.
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: 키 · 토큰 · 이메일은 지우고 붙입니다.
      render: shell
