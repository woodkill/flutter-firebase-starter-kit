			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "\n#!/bin/bash\nPATH=\"${PATH}:$FLUTTER_ROOT/bin:${PUB_CACHE}/bin:$HOME/.pub-cache/bin\"\n\nif [ -z \"$PODS_ROOT\" ] || [ ! -d \"$PODS_ROOT/FirebaseCrashlytics\" ]; then\n  # Cannot use \"BUILD_DIR%/Build/*\" as per Firebase documentation, it points to \"flutter-project/build/ios/*\" path which doesn't have run script\n  DERIVED_DATA_PATH=$(echo \"$BUILD_ROOT\" | sed -E 's|(.*DerivedData/[^/]+).*|\\1|')\n  # Phase 16.3 R-05: Flutter passes -clonedSourcePackagesDirPath <project>/build/ios/SourcePackages to every iOS xcodebuild invocation, so the SPM checkout is NOT under DerivedData. Probe the Flutter path first and keep the DerivedData path as fallback.\n  for CANDIDATE in \"${SRCROOT}/../build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\" \"${DERIVED_DATA_PATH}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\"; do\n    if [ -f \"$CANDIDATE\" ]; then\n      PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"$CANDIDATE\"\n      # Phase 16.3 WR-01(R2): record which candidate won. The order above is correct for flutter-driven builds (flutter passes -clonedSourcePackagesDirPath <project>/build/ios/SourcePackages to every iOS xcodebuild invocation, archive included), but an Xcode IDE build gets no such flag and resolves under DerivedData -- there a stale build/ios/SourcePackages left by an earlier flutter build still wins this probe. No build setting separates the two cases (BUILD_DIR is overridden only for non-archive flutter builds), so log the choice instead of guessing it. See docs/manual.md section 6 of the SPM chapter.\n      echo \"note: Crashlytics upload script = $CANDIDATE\"\n      break\n    fi\n  done\n  # Phase 16.3 WR-01: both probes may miss (e.g. a custom/relative Xcode build location leaves no \"DerivedData\" segment in BUILD_ROOT for the sed above). Fail loudly with the probed paths instead of passing an empty --upload-symbols-script-path, which surfaces as an opaque ProcessException from flutterfire_cli.\n  if [ -z \"$PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT\" ]; then\n    echo \"error: firebase-ios-sdk Crashlytics/run not found. Probed: ${SRCROOT}/../build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run and ${DERIVED_DATA_PATH}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\" >&2\n    exit 1\n  fi\nelse\n  PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"$PODS_ROOT/FirebaseCrashlytics/run\"\nfi\n\n# Command to upload symbols script used to upload symbols to Firebase server\nflutterfire upload-crashlytics-symbols --upload-symbols-script-path=\"$PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT\" --platform=ios --apple-project-path=\"${SRCROOT}\" --env-platform-name=\"${PLATFORM_NAME}\" --env-configuration=\"${CONFIGURATION}\" --env-project-dir=\"${PROJECT_DIR}\" --env-built-products-dir=\"${BUILT_PRODUCTS_DIR}\" --env-dwarf-dsym-folder-path=\"${DWARF_DSYM_FOLDER_PATH}\" --env-dwarf-dsym-file-name=\"${DWARF_DSYM_FILE_NAME}\" --env-infoplist-path=\"${INFOPLIST_PATH}\" --default-config=default\n";
