name: flutter_starter_kit
description: "Flutter + Firebase 모바일 앱 Starter Kit — 인증 · 다국어 · 디자인 시스템 · Firebase 설정과 Feature-First 구조."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  args: ^2.7.0
  shared_preferences: ^2.5.5
  gap: ^3.0.1
  go_router: ^17.2.0
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1
  flutter_facebook_auth: ^7.2.0
  kakao_flutter_sdk_user: ^2.0.0+1
  # Phase 16.2 — Naver 로그인 플러그인 (Custom Token 방식). unverified publisher
  # 라 정확 버전 고정 — caret 금지 (C-02). 상향 시 `16.2-PLUGIN-AUDIT.md` 의
  # sha256 기준선과 상향 절차로 diff 를 먼저 검토한다.
  naver_login_flutter: 4.0.0
  # Phase 14 D-LINE-17 — LINE Corporation 공식 (verified publisher:
  # developers.line.biz). 정확 버전 고정 — caret 금지: 플러그인의
  # `ios/flutter_line_sdk/Package.swift` 가 선언하는 `line-sdk-ios-swift`
  # 하한(`from:`)은 판에 따라 다르고(2.7.2 `5.13.0` · 3.0.0 `5.17.0`), iOS
  # `Package.resolved` 의 LINE 핀이 그 하한을 만족해야 한다. 상향 시
  # `fvm flutter pub get` 만 쓰고 lock diff 가 LINE 항목뿐인지 본 뒤, 새 판의
  # 하한과 핀을 대조하고 iOS 빌드 뒤 두 `Package.resolved` 가 그대로인지 확인한다
  # — docs/manual.md 「iOS 의존성 관리 (SPM)」 의
  # 「② 네이티브 SDK 버전은 어디에 고정돼 있나」.
  flutter_line_sdk: 3.0.0
  # Phase 13.2 — see ROADMAP.md (Wave 0 lock D-100, R8 — 옛 community
  # 버튼 위제 의존성 제거). Facebook 분기는 BrandedSocialButton.facebook
  # (Meta 공식 PNG + 자체 위제) 위임 일관.
  flutter_svg: ^2.2.4
  flutter_native_splash: ^2.4.7
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  cloud_firestore: ^6.10.0
  firebase_remote_config: ^6.7.0
  cloud_functions: ^6.5.0
  firebase_app_check: ^0.4.8
  # Naver 웹 OAuth 세션 (verified publisher femtopedia.de). 내장 Kotlin 을
  # 지원하는 6.x 는 아직 정식판 전 alpha 라 정확한 판으로 고정한다 — 정식
  # 6.0.0 이 나오면 `^6.0.0` 으로 올린다. 6.x 는 transitive `material_ui` ·
  # `cupertino_ui` 를 끌어와 lock 의 하한이 Dart 3.13 · Flutter 3.47 이 된다.
  flutter_web_auth_2: 6.0.0-alpha.8
  # Facebook iOS Limited Login nonce SHA-256 해시 (debug
  # ios-facebook-limited-login, dart.dev 공식 — Firebase Flutter 문서 권장).
  # 이미 transitive 3.0.7 로 잠겨 있어 버전 해석 변화 0.
  crypto: ^3.0.7
  # Phase 17 — see ROADMAP.md (D-01 · D-15). FCM · Storage 는 FlutterFire 공식
  # (firebase.google.com), 로컬 알림은 dexterx.dev, 사진 선택은 flutter.dev.
  # image_picker_android · _platform_interface 는 Android Photo Picker opt-in
  # 코드가 직접 import 하므로 직접 의존으로 둔다 (depend_on_referenced_packages).
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter_local_notifications: ^22.3.1
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  woody_lints:
    git:
      url: https://github.com/woodkill/woody_lints.git
      ref: main
  riverpod_lint: ^3.1.3
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.4

  # 10-REVIEW WR-21 회귀 테스트 전용 — SharedPreferencesStorePlatform 를
  # 실패하는 fake 로 교체해 영속화 실패 경로(롤백)를 재현한다. 런타임
  # 의존이 아니라 `shared_preferences` 의 transitive 를 명시화한 것이며,
  # 직접 import 하므로 depend_on_referenced_packages 규칙을 만족시킨다.
  shared_preferences_platform_interface: ^2.4.2
  test: ^1.30.0
  # Phase 16.2 D-16: NaverSdkClient 타이머 부재 회귀 가드 — 가상 시간 10분
  # 경과 뒤에 완료되는 로그인 결과가 보존되는지 본다 (T-16.2-NAVER-SDK-20).
  # flutter_test 가 transitive 로 노출하지만 명시 의존 정책 일관.
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/splash/
    # Phase 13 — see ROADMAP.md (D-52 Brand Asset): 신규 brand SVG 는
    # `assets/icons/` directory 등록을 통해 자동 포함. 개별 파일 추가 등록 금지
    # (WR-02-iter2 — directory 등록과 individual 등록 이중화 회피).
    - assets/icons/
    # 로그인 버튼의 브랜드 자산 — provider 마다 디렉터리 하나. Flutter 는 선언한
    # 디렉터리의 바로 아래 파일만 싣는다(하위 디렉터리는 따로 선언한다).
    # Google 은 `g.png` 하나를 이름으로 부르고, 같은 이름의 해상도 변형
    # (`2.0x/` · `3.0x/` · `4.0x/`)은 아래 한 줄이 함께 싣는다.
    - assets/brand/kakao/
    - assets/brand/naver/
    - assets/brand/google/
    - assets/brand/apple/
    # Apple 로고는 색별 디렉터리 2개다 — `black_logo/` 는 어두운 테마(흰 버튼),
    # `white_logo/` 는 밝은 테마(검정 버튼)에 쓴다.
    - assets/brand/apple/black_logo/
    - assets/brand/apple/white_logo/
    # Meta trademark — Brand Resource Center 라이선스 사전 동의 의무,
    # assets/brand/facebook/LICENSE.txt 참조 (Phase 13.2 REVIEW WR-03 정정).
    - assets/brand/facebook/
    - assets/brand/line/

  # 앱에 싣는 글꼴은 둘이다 — Roboto(앱 전체의 영문 글자)와 Google Sans 라틴
  # subset(Google 로그인 버튼의 영문 라벨). 한글 · 가나는 기기 글꼴로 그려진다.
  # 글꼴을 더하려면 아래에 family 를 더하고 그 라이선스 파일을 LICENSE 에 적는다.
  fonts:
    # Phase 13.3 Wave 4 Step 3 (2026-05-16) — Roboto variable font.
    # Android 에서 앱의 영문 글자와 Google 을 뺀 5개 로그인 버튼의 라벨
    # (`kBrandLabelFontFamily`)에 쓴다 — iOS · macOS 의 버튼 라벨은 시스템
    # 글꼴이다. 번들해 두면 테스트 환경(macOS)에서 `Roboto` 가 시스템 글꼴로
    # 대체돼 w500 이 합성 굵기(synthetic bold)로 그려지는 일이 없다.
    # SIL OFL 1.1 (`assets/fonts/roboto/OFL.txt`, `README.md`).
    # Variable axes: wdth (75-100) + wght (100-900) —
    # Flutter `fontWeight: FontWeight.w500` 명시 시 wght axis 500 자동 매핑.
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-VariableFont_wdth_wght.ttf
    # Google Sans 라틴 subset — Google 로그인 버튼의 영문 라벨에 쓴다. SIL OFL 1.1
    # (`assets/fonts/googlesans/OFL.txt`, `README.md`). 굵기는 파일의 `wght` 축
    # (400-700)으로 그린다 — `FontWeight.w500` 이 wght 500 으로 그려진다.
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/googlesans/GoogleSans-Latin-wght.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
