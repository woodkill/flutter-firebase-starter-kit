name: flutter_starter_kit
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.3.0
  args: ^2.7.0
  shared_preferences: ^2.5.5
  gap: ^3.0.1
  go_router: ^17.2.0
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1
  flutter_facebook_auth: ^7.1.6
  kakao_flutter_sdk_user: ^2.0.0+1
  # Phase 13 — see ROADMAP.md (Naver Login SDK, Custom Token 방식)
  naver_login_sdk: ^3.2.1
  # Phase 14 D-LINE-17 — LINE Corporation 공식 (verified publisher: line.me)
  flutter_line_sdk: ^2.7.2
  # Phase 13.2 — see ROADMAP.md (Wave 0 lock D-100, R8 — 옛 community
  # 버튼 위제 의존성 제거). Facebook 분기는 BrandedSocialButton.facebook
  # (Meta 공식 PNG + 자체 위제) 위임 일관.
  flutter_svg: ^2.2.4
  flutter_native_splash: ^2.4.7
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  cloud_firestore: ^6.3.0
  firebase_remote_config: ^6.4.0
  cloud_functions: ^6.2.0
  firebase_app_check: ^0.4.3
  sign_in_with_apple: ^8.0.0
  # Phase 15 D-YJP-01 — OpenID Foundation 공식 AppAuth-iOS/Android 래핑
  # (verified publisher: dexterx.dev). Yahoo!JP Flutter wrapper 부재 →
  # OIDC 표준 라이브러리로 OAuth flow + PKCE + ID Token nonce 자동 처리.
  flutter_appauth: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  woody_lints:
    git:
      url: https://github.com/woodkill/woody_lints.git
      ref: main
  riverpod_lint: ^3.1.3
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.4

  # 10-REVIEW WR-21 회귀 테스트 전용 — SharedPreferencesStorePlatform 를
  # 실패하는 fake 로 교체해 영속화 실패 경로(롤백)를 재현한다. 런타임
  # 의존이 아니라 `shared_preferences` 의 transitive 를 명시화한 것이며,
  # 직접 import 하므로 depend_on_referenced_packages 규칙을 만족시킨다.
  shared_preferences_platform_interface: ^2.4.2
  test: ^1.30.0
  # WR-01 (Phase 13 review): NaverSdkClient timeout race 회귀 가드 (60s
  # 가상 경과). flutter_test 가 transitive 로 노출하지만 명시 의존 정책 일관.
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/splash/
    # Phase 13 — see ROADMAP.md (D-52 Brand Asset): 신규 brand SVG 는
    # `assets/icons/` directory 등록을 통해 자동 포함. 개별 파일 추가 등록 금지
    # (WR-02-iter2 — directory 등록과 individual 등록 이중화 회피).
    - assets/icons/
    # Phase 13.1 — see ROADMAP.md (R3/R4/R5/R9/R11/R12 — 7 provider brand assets)
    # Phase 13.3 — see ROADMAP.md (R7 Wave 3 D-117 — wide baked-in 자상 18 file
    # git rm + leaf 디렉토리 entry 정리. Kakao/Naver 는 README+LICENSE 만 잔존,
    # Google 는 light/dark 의 btn_signin_icon.svg 보존, neutral/ 폐기).
    # Flutter 의 assets 디렉토리 등록은 단일 레벨만 (재귀 아님) — 자상 path 가
    # leaf 디렉토리에 위치하므로 모든 leaf 를 명시 등록한다 (Plan 13.1-08
    # Rule 2 정정 — Plan 13.1-01/03 의 "자동 재귀" 가정 오류).
    # .placeholder / README 파일은 bundle 에 포함되어도 무해.
    #
    # **Phase 13.3 code review IN-03 정정 (2026-05-17):** Google Identity 의
    # "G" 마크는 theme-independent (light/dark variant 는 bg + label color 만
    # 분기). 기존 light/dark 디렉토리 + byte-identical SVG 2개 폐기 → 단일
    # `assets/brand/google/btn_signin_icon.svg` 로 일원화 (Facebook 의 "single
    # Primary Logo" 패턴 mirror). `_renderGoogleButton` 의 iconPath 도 분기
    # 폐기 + 단일 path.
    - assets/brand/kakao/
    - assets/brand/naver/
    - assets/brand/google/
    - assets/brand/apple/
    # Phase 13.3 Wave 4 Step 2 (2026-05-15): Apple Logo-only SVG (Logo-Sign-in-with-Apple.dmg
    # from developer.apple.com/design/resources/).
    # Phase 13.3 code review IN-04 정정 (2026-05-17): 디렉토리 명명 logo 색 기준
    # 으로 변경 (이전 light/dark 는 SVG 내부 rect bg 기준이라 Flutter theme 와
    # 정반대 매핑). black_logo = 검정 logo on 흰 bg (Flutter dark theme 매핑) /
    # white_logo = 흰 logo on 검정 bg (Flutter light theme 매핑). wrapper bg 와
    # 동색 일치 시 정사각 외곽 invisible.
    - assets/brand/apple/black_logo/
    - assets/brand/apple/white_logo/
    # Meta trademark — Brand Resource Center 라이선스 사전 동의 의무,
    # assets/brand/facebook/LICENSE.txt 참조 (Phase 13.2 REVIEW WR-03 정정).
    - assets/brand/facebook/
    - assets/brand/line/
    # Phase 15 D-YJP-07 — Yahoo!JP brand asset 디렉토리. Plan 15-01 (Wave 0)
    # 의 `.placeholder` sentinel 등록 후 Plan 15-04 (Wave 1) 사용자 verbatim
    # sign-off 시 공식 자상으로 대체 의무.
    - assets/brand/yahoojp/

  # Phase 13.3 Wave 4 Step 3 (2026-05-16) — Inter Medium (SIL Open Font License
  # 1.1, github.com/rsms/inter v4.1) Android/Linux test env fallback font for
  # Apple Sign-in 버튼 라벨. iOS/macOS 환경에서는 system 'SF Pro Text' 자동 사용
  # (Apple OS system font), 다른 환경에서는 Inter Medium fallback. SF Pro 와
  # 가장 시각적으로 유사한 license-safe open-source font. Apple SF Pro Font
  # License Agreement 부합 — Apple Font binary 미배포 (system font 만 활용),
  # Inter binary 는 SIL OFL 1.1 으로 자유 배포.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
    # Phase 13.3 Wave 4 Step 3 (2026-05-16) — Roboto variable font.
    # Google Identity Services production CSS `font-family: 'Roboto'` verbatim
    # 부합 + test env synthetic bold 회피. SIL OFL 1.1 (`assets/fonts/roboto/
    # OFL.txt`, `README.md`). Variable axes: wdth (75-100) + wght (100-900) —
    # Flutter `fontWeight: FontWeight.w500` 명시 시 wght axis 500 자동 매핑.
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-VariableFont_wdth_wght.ttf
    # Phase 13.3 Wave 4 Step 3 (2026-05-16) — Pretendard variable font.
    # NAVER ID 로그인 BI 공식 PNG 자상 (NAVER_login_Light_EN_green_center_H48)
    # 의 라벨 글리프 시각 가장 부합 + 한국 design 표준 web font. SIL OFL 1.1
    # (`assets/fonts/pretendard/OFL.txt`, `README.md`). Variable axis: wght
    # (100-900) — Flutter `fontWeight: FontWeight.w800` 명시 시 wght axis 800
    # 자동 매핑. v1.3.9 (2023-11-05) public/variable/PretendardVariable.ttf.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/PretendardVariable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
